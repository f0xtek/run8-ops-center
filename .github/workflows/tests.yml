name: Tests

# The one definition of "tests pass". ci.yml and release.yml both call it.
# Linux always runs with the race detector. Windows runs without it, and only
# when the caller leaves `windows` on.
on:
  workflow_call:
    inputs:
      windows:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows && '[{"os":"ubuntu-latest","race":"-race"},{"os":"windows-latest","race":""}]' || '[{"os":"ubuntu-latest","race":"-race"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ${{ matrix.race }} ./...
