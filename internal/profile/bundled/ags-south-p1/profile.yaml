# AGS South Phase 1 (NS Birmingham, AL) route profile for Run8 Operations Centre.
#
# The operating scheme follows the AGS NS Birmingham Guide. Industries come from
# IndustryConfiguration.csv and train limits from train_limits.tsv, both in this
# folder. Edit this file freely. When a new version of the app ships a newer
# schemaVersion, it replaces this file and keeps your old copy as
# profile.yaml.v<old>.bak.
schemaVersion: 5
id: ags-south-p1
name: AGS South Phase 1 (NS Birmingham)

# Where Run8 keeps the world saves and auto-saves for this route.
defaultSaveDir: 'C:\Run8Studios\Run8 Train Simulator V3\Content\V3Routes\Regions\GulfCoast\Trains'
defaultAutoSaveDir: 'C:\Run8Studios\Run8 Train Simulator V3\Content\V3Routes\Regions\GulfCoast\AutoSaves'

# Each yard can list its tracks: a name, a length in feet and a kind (yard,
# siding or main). The lists come from The Depot's AGS South and Norris Yard
# maps, as names and lengths only. Learn mode offers the names as hints, and the
# yards view shows which ones are not labelled yet. A siding or main entry
# labels its sections as ignored. Norris receiving is left out, because the Run8
# import names those tracks: the 14 receiving tracks, including the two
# thoroughfares, come from the trackEnds rule at the end of this file.
#
# A yard track with "departure: true" is a departure track. When a yard has any,
# orders count a car as in that yard only if it stands on one, so cars in the
# bowl, in receiving or on an unlisted track do not feed orders. A yard with no
# departure tracks counts every yard track. At Norris these are the forwarding
# yards, the CAB tracks and the local yard. Mark or unmark any track in the
# yards view. Those marks live in settings.json and are not written to this file.
yards:
  - code: NOR
    name: Norris
    anchorMileposts: [Receiving Yard, West Forwarding Yard, East Forwarding Yard]
    tracks:
      # East forwarding
      - {name: EF01, lengthFt: 2625, departure: true}
      - {name: EF02, lengthFt: 2625, departure: true}
      - {name: EF03, lengthFt: 2432, departure: true}
      - {name: EF04, lengthFt: 2530, departure: true}
      - {name: EF05, lengthFt: 7025, departure: true}
      - {name: EF06, lengthFt: 6835, departure: true}
      - {name: EF07, lengthFt: 6563, departure: true}
      - {name: Southern Outbound, lengthFt: 2478, departure: true}
      - {name: East Thoroughfare, kind: main}
      # West forwarding
